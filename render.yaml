services:
  - type: web
    name: e-pharmacy-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "26.13.0"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
